<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shorts Auto-Scroll & Speed</title>
  <style>
    body {
      width: 250px;
      margin: 0;
      padding: 16px;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    h3 {
      margin: 0 0 14px 0;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group img {
      border-radius: 4px;
    }

    .card {
      background: #1f1f1f;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2ecc71;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #aaa;
      margin-bottom: 8px;
    }

    .speed-buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-bottom: 10px;
    }

    .speed-btn {
      background: #2b2b2b;
      border: 1px solid #3d3d3d;
      color: #ccc;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .speed-btn:hover {
      background: #3a3a3a;
      color: #fff;
    }

    .speed-btn.active {
      background: #3ea6ff;
      border-color: #3ea6ff;
      color: #000;
    }

    .range-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #3ea6ff;
      cursor: pointer;
    }

    .speed-val {
      font-size: 12px;
      font-weight: 700;
      color: #3ea6ff;
      width: 38px;
      text-align: right;
    }

    .hint {
      font-size: 11px;
      color: #888;
      text-align: center;
      line-height: 1.3;
    }

    .kbd {
      background: #333;
      padding: 1px 6px;
      border-radius: 4px;
      color: #3ea6ff;
      font-family: monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>
    <span class="title-group">
      <img src="icon48.png" width="18" height="18" alt="logo">
      Shorts Control
    </span>
    <span style="font-size: 11px; color: #aaa;">v5.3</span>
  </h3>

  <div class="card">
    <div class="toggle-row">
      <span class="toggle-label">Auto-Scroll</span>
      <label class="switch">
        <input type="checkbox" id="autoscroll-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Playback Speed</div>
    <div class="speed-buttons">
      <button class="speed-btn" data-speed="1.0">1.0x</button>
      <button class="speed-btn" data-speed="1.25">1.25x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="1.75">1.75x</button>
      <button class="speed-btn" data-speed="2.0">2.0x</button>
    </div>
    <div class="range-container">
      <input type="range" id="speed-range" min="0.5" max="3.0" step="0.05" value="1.0">
      <span class="speed-val" id="speed-val">1.0x</span>
    </div>
  </div>

  <div class="hint">
    Use <span class="kbd">&lt;</span> and <span class="kbd">&gt;</span> to adjust speed
  </div>

  <script src="popup.js"></script>
</body>
</html>
